name: Validate roadmap and labs

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - run: python scripts/render_roadmap.py
      - run: git diff --exit-code ROADMAP.md
      - run: python scripts/validate_roadmap.py
      - run: pytest -q
      - run: ruff check labs scripts tests
