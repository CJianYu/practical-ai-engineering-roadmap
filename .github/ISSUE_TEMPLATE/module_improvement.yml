name: Module improvement
description: Propose a scoped improvement to one Learn/Build/Prove/Explain module
title: "[Module]: "
labels: [curriculum]
body:
  - type: input
    id: module
    attributes:
      label: Module path
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Learner problem
      description: What is unclear, missing, misleading, or difficult to verify?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: How should the change be validated?
    validations:
      required: true
